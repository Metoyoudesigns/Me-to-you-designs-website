<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Me To You Designs • Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--rose:#c87991;--deep:#6f4354;--pale:#fff7fa;--line:#ead7de;--ink:#3f3036;--muted:#806b73;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{background:var(--deep);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.brand{font-family:Georgia,serif;font-size:22px}.top small{opacity:.8}
.wrap{max-width:1200px;margin:auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 30px #7a4c5b12}
.grid{display:grid;grid-template-columns:260px 1fr;gap:20px}
.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--deep);padding:13px 14px;border-radius:10px;margin:4px 0}
.nav button.active,.nav button:hover{background:#f8e7ed}
h1,h2,h3{font-family:Georgia,serif;color:var(--deep);font-weight:500}
h1{font-size:36px;margin:0 0 8px}h2{font-size:27px}.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--rose);color:#fff;font-weight:700}
.btn.secondary{background:#f6e7ec;color:var(--deep)}.btn.danger{background:#9e435d}
input,textarea,select{width:100%;border:1px solid #ddcbd2;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}.field{margin:0 0 14px}.field label{display:block;font-weight:700;margin:0 0 6px;color:var(--deep)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{color:var(--deep)}
.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#f7e8ed}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f7e4ea;color:var(--deep);font-size:12px;font-weight:700}
.switch{display:flex;gap:8px;align-items:center}.switch input{width:auto}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat b{display:block;font-size:28px;color:var(--deep);margin-top:6px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(460px,100%)}
.notice{padding:11px 13px;border-radius:10px;background:#fff1f4;border:1px solid var(--line);margin:12px 0}.ok{background:#effaf4;border-color:#bfe7cf}.hidden{display:none!important}
.drop{border:2px dashed #dfbdc9;border-radius:14px;padding:20px;text-align:center;background:#fff9fb}
@media(max-width:800px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}.top{position:relative}.table{font-size:13px}.wrap{padding:14px}.nav{display:flex;overflow:auto;gap:6px}.nav button{white-space:nowrap;width:auto}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="card">
    <h1>Me To You Designs</h1>
    <p class="muted">Shop Admin</p>
    <div id="configNotice" class="notice">First, add your Supabase project details below. Use your Project URL and publishable/anon key only. Never put a service-role key in this file.</div>
    <div class="field"><label>Supabase Project URL</label><input id="sbUrl" placeholder="https://your-project.supabase.co"></div>
    <div class="field"><label>Supabase Publishable / Anon Key</label><textarea id="sbKey" style="min-height:80px" placeholder="Your public client key"></textarea></div>
    <button class="btn" id="saveConfig">Connect Supabase</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
    <div id="authBox" class="hidden">
      <h2>Admin sign in</h2>
      <div class="field"><label>Email</label><input id="email" type="email" value="metoyoudesigns@outlook.com"></div>
      <div class="field"><label>Password</label><input id="password" type="password"></div>
      <div class="row"><button class="btn" id="signIn">Sign in</button><button class="btn secondary" id="signUp">Create account</button></div>
      <div id="authMsg" class="notice hidden"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
<header class="top"><div><div class="brand">Me To You Designs • Admin</div><small>Shop control centre</small></div><button class="btn secondary" id="signOut">Sign out</button></header>
<div class="wrap">
<div class="grid">
<aside class="card nav">
<button data-page="dashboard" class="active">Dashboard</button>
<button data-page="products">Products</button>
<button data-page="categories">Categories</button>
<button data-page="delivery">Delivery</button>
<button data-page="settings">Website & Policies</button>
</aside>
<main id="content"></main>
</div>
</div>
</div>

<script>
const CONFIG_KEY='mtyd_admin_supabase_config';
let sb=null, currentUser=null, editingProduct=null, editingCategory=null;

const $=id=>document.getElementById(id);
function msg(text,ok=false){const el=$('authMsg');el.textContent=text;el.className='notice '+(ok?'ok':'');}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function slugify(s){return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function getConfig(){try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')}catch{return null}}
function setPage(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name)); if(name==='dashboard')dashboard(); if(name==='products')products(); if(name==='categories')categories(); if(name==='delivery')delivery(); if(name==='settings')settings();}

async function connect(){
 const url=$('sbUrl').value.trim(), key=$('sbKey').value.trim();
 if(!url||!key)return msg('Enter both Supabase details.');
 try{
   sb=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));
   $('authBox').classList.remove('hidden'); $('configNotice').textContent='Supabase connected. Sign in with your admin account.';
   const {data:{session}}=await sb.auth.getSession(); if(session) await afterLogin(session.user);
 }catch(e){msg(e.message)}
}
async function afterLogin(user){
 currentUser=user;
 if(user.email?.toLowerCase()!=='metoyoudesigns@outlook.com'){await sb.auth.signOut();return msg('This admin is restricted to the store owner email.');}
 $('loginView').classList.add('hidden');$('app').classList.remove('hidden');setPage('dashboard');
}
$('saveConfig').onclick=connect;
$('signIn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error)return msg(error.message); const {data:{user}}=await sb.auth.getUser(); await afterLogin(user);}
$('signUp').onclick=async()=>{const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value}); if(error)return msg(error.message); msg(data.session?'Account created. You are signed in.':'Account created. Check your email if confirmation is enabled.',true);}
$('signOut').onclick=async()=>{await sb.auth.signOut();location.reload();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));

async function count(table){const {count,error}=await sb.from(table).select('*',{count:'exact',head:true});return error?0:count||0}
async function dashboard(){
 $('content').innerHTML=`<h1>Dashboard</h1><p class="muted">Your shop data is stored in Supabase, so it can be managed from other browsers once they sign in.</p><div class="statgrid"><div class="stat">Products<b id="pCount">—</b></div><div class="stat">Categories<b id="cCount">—</b></div><div class="stat">Best Sellers<b id="bCount">—</b></div><div class="stat">Live Products<b id="lCount">—</b></div></div><div class="card" style="margin-top:16px"><h2>Build order</h2><p>Products and categories come first. Then delivery, policies, search and the customer basket can all read from the same catalogue.</p></div>`;
 $('pCount').textContent=await count('products');$('cCount').textContent=await count('categories');$('bCount').textContent=await count('products',true);
 const {count:live}=await sb.from('products').select('*',{count:'exact',head:true}).eq('active',true);$('lCount').textContent=live||0;
}
async function products(){
 $('content').innerHTML=`<div class="row between"><div><h1>Products</h1><p class="muted">Add products once. The customer website can use this catalogue later.</p></div><button class="btn" id="newProduct">+ Add product</button></div><div class="card"><div id="productList">Loading…</div></div>`;
 $('newProduct').onclick=()=>productForm();
 await renderProducts();
}
async function renderProducts(){
 const {data,error}=await sb.from('products').select('*,categories(name)').order('created_at',{ascending:false});
 if(error)return $('productList').innerHTML=`<div class="notice">${esc(error.message)}</div>`;
 if(!data.length)return $('productList').innerHTML='<p class="muted">No products yet. Add your first product.</p>';
 $('productList').innerHTML=`<table class="table"><thead><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${data.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:'—'}</td><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.sku||'')}</span></td><td>${esc(p.categories?.name||'')}</td><td>£${Number(p.price||0).toFixed(2)}</td><td>${p.active?'<span class="pill">Live</span>':'<span class="pill">Hidden</span>'} ${p.is_best_seller?'<span class="pill">Best Seller</span>':''}</td><td><button class="btn secondary" onclick="productForm('${p.id}')">Edit</button></td></tr>`).join('')}</tbody></table>`;
}
async function productForm(id){
 editingProduct=id||null;
 let p={name:'',slug:'',short_description:'',description:'',price:'',compare_at_price:'',sku:'',image_url:'',badge:'',category_id:'',is_best_seller:false,active:true,instant_download:false,seo_title:'',seo_description:'',seo_keywords:'',tags:'',options:''};
 if(id){const {data,error}=await sb.from('products').select('*').eq('id',id).single();if(error)return alert(error.message);p={...p,...data,tags:(data.tags||[]).join(', '),options:JSON.stringify(data.options||{},null,2)}}
 const {data:cats}=await sb.from('categories').select('*').eq('active',true).order('sort_order');
 $('content').innerHTML=`<div class="row between"><div><h1>${id?'Edit product':'Add product'}</h1><p class="muted">Prices are product prices. Delivery can be configured separately.</p></div><button class="btn secondary" id="backProducts">Back</button></div>
 <div class="card"><div class="formgrid">
 <div class="field"><label>Product name</label><input id="fName" value="${esc(p.name)}"></div>
 <div class="field"><label>Slug</label><input id="fSlug" value="${esc(p.slug)}" placeholder="personalised-pyjamas"></div>
 <div class="field"><label>Category</label><select id="fCat"><option value="">Choose category</option>${(cats||[]).map(c=>`<option value="${c.id}" ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div class="field"><label>SKU</label><input id="fSku" value="${esc(p.sku||'')}"></div>
 <div class="field"><label>Price (£)</label><input id="fPrice" type="number" step="0.01" min="0" value="${esc(p.price)}"></div>
 <div class="field"><label>Compare-at price (£) <span class="muted">optional</span></label><input id="fCompare" type="number" step="0.01" min="0" value="${esc(p.compare_at_price||'')}"></div>
 <div class="field"><label>Badge</label><input id="fBadge" value="${esc(p.badge||'')}" placeholder="PERSONALISED"></div>
 <div class="field"><label>Product image</label><input id="fImage" type="url" value="${esc(p.image_url||'')}" placeholder="Supabase image URL"></div>
 <div class="field full"><label>Short description</label><input id="fShort" value="${esc(p.short_description||'')}"></div>
 <div class="field full"><label>Full description</label><textarea id="fDesc">${esc(p.description||'')}</textarea></div>
 <div class="field"><label>Tags / search words</label><input id="fTags" value="${esc(p.tags||'')}" placeholder="pyjamas, personalised, kids"></div>
 <div class="field"><label>Options JSON</label><textarea id="fOptions" style="min-height:80px">${esc(p.options||'{}')}</textarea></div>
 <div class="field"><label>SEO title</label><input id="fSeoTitle" value="${esc(p.seo_title||'')}"></div>
 <div class="field"><label>SEO description</label><textarea id="fSeoDesc">${esc(p.seo_description||'')}</textarea></div>
 <div class="field full"><label>SEO keywords</label><input id="fSeoKeys" value="${esc(p.seo_keywords||'')}"></div>
 <label class="switch"><input id="fBest" type="checkbox" ${p.is_best_seller?'checked':''}> Show as Best Seller</label>
 <label class="switch"><input id="fActive" type="checkbox" ${p.active!==false?'checked':''}> Product visible in shop</label>
 <label class="switch"><input id="fInstant" type="checkbox" ${p.instant_download?'checked':''}> Instant digital download</label>
 </div><div class="row" style="margin-top:10px"><button class="btn" id="saveProduct">${id?'Save changes':'Add product'}</button>${id?'<button class="btn danger" id="deleteProduct">Delete product</button>':''}</div><div id="saveMsg" class="notice hidden"></div></div>`;
 $('fName').addEventListener('input',()=>{if(!$('fSlug').dataset.edited)$('fSlug').value=slugify($('fName').value)});
 $('fSlug').addEventListener('input',()=>{$('fSlug').dataset.edited='1'});
 $('backProducts').onclick=products;$('saveProduct').onclick=saveProduct;
 if(id)$('deleteProduct').onclick=deleteProduct;
}
async function saveProduct(){
 let options={};try{options=JSON.parse($('fOptions').value||'{}')}catch{return alert('Options JSON is not valid JSON.')}
 const payload={name:$('fName').value.trim(),slug:slugify($('fSlug').value),category_id:$('fCat').value||null,sku:$('fSku').value.trim()||null,price:Number($('fPrice').value||0),compare_at_price:$('fCompare').value?Number($('fCompare').value):null,badge:$('fBadge').value.trim()||null,image_url:$('fImage').value.trim()||null,short_description:$('fShort').value.trim()||null,description:$('fDesc').value.trim()||null,tags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),options,is_best_seller:$('fBest').checked,active:$('fActive').checked,instant_download:$('fInstant').checked,seo_title:$('fSeoTitle').value.trim()||null,seo_description:$('fSeoDesc').value.trim()||null,seo_keywords:$('fSeoKeys').value.trim()||null,updated_at:new Date().toISOString()};
 let q=editingProduct?sb.from('products').update(payload).eq('id',editingProduct):sb.from('products').insert(payload);
 const {error}=await q;if(error)return alert(error.message);products();
}
async function deleteProduct(){if(!confirm('Delete this product?'))return;const {error}=await sb.from('products').delete().eq('id',editingProduct);if(error)return alert(error.message);products();}

async function categories(){
 $('content').innerHTML=`<div class="row between"><div><h1>Categories</h1><p class="muted">These become your Shop menu categories. You can add more whenever you need.</p></div><button class="btn" id="newCat">+ Add category</button></div><div class="card"><div id="catList">Loading…</div></div>`;
 $('newCat').onclick=()=>categoryForm(); await renderCategories();
}
async function renderCategories(){
 const {data,error}=await sb.from('categories').select('*').order('sort_order').order('name');
 if(error)return $('catList').innerHTML=`<div class="notice">${esc(error.message)}</div>`;
 $('catList').innerHTML=data.length?`<table class="table"><thead><tr><th>Category</th><th>Slug</th><th>Order</th><th>Status</th><th></th></tr></thead><tbody>${data.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.description||'')}</span></td><td>${esc(c.slug)}</td><td>${c.sort_order}</td><td>${c.active?'Live':'Hidden'}</td><td><button class="btn secondary" onclick="categoryForm('${c.id}')">Edit</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">No categories yet.</p>';
}
async function categoryForm(id){
 editingCategory=id||null;let c={name:'',slug:'',description:'',sort_order:0,active:true};
 if(id){const {data,error}=await sb.from('categories').select('*').eq('id',id).single();if(error)return alert(error.message);c=data}
 $('content').innerHTML=`<div class="row between"><h1>${id?'Edit category':'Add category'}</h1><button class="btn secondary" id="backCats">Back</button></div><div class="card"><div class="formgrid"><div class="field"><label>Category name</label><input id="cName" value="${esc(c.name)}"></div><div class="field"><label>Slug</label><input id="cSlug" value="${esc(c.slug)}"></div><div class="field full"><label>Description</label><textarea id="cDesc">${esc(c.description||'')}</textarea></div><div class="field"><label>Display order</label><input id="cOrder" type="number" value="${c.sort_order||0}"></div><label class="switch"><input id="cActive" type="checkbox" ${c.active?'checked':''}> Show in Shop</label></div><button class="btn" id="saveCat">${id?'Save changes':'Add category'}</button></div>`;
 $('cName').oninput=()=>{if(!$('cSlug').dataset.edited)$('cSlug').value=slugify($('cName').value)};$('cSlug').oninput=()=>{$('cSlug').dataset.edited='1'};
 $('backCats').onclick=categories;$('saveCat').onclick=async()=>{const payload={name:$('cName').value.trim(),slug:slugify($('cSlug').value),description:$('cDesc').value.trim()||null,sort_order:Number($('cOrder').value||0),active:$('cActive').checked};const q=editingCategory?sb.from('categories').update(payload).eq('id',editingCategory):sb.from('categories').insert(payload);const {error}=await q;if(error)return alert(error.message);categories();}
}
async function delivery(){
 $('content').innerHTML=`<h1>Delivery</h1><p class="muted">This is where we'll keep delivery rules separate from product prices.</p><div class="card"><div class="formgrid"><div class="field"><label>Free delivery threshold (£)</label><input id="dFree" type="number" step="0.01" placeholder="100"></div><div class="field"><label>Default delivery (£)</label><input id="dDefault" type="number" step="0.01" placeholder="3.99"></div><div class="field full"><label>Delivery notes</label><textarea id="dNotes" placeholder="Royal Mail, Evri, InPost etc."></textarea></div></div><button class="btn" id="saveDelivery">Save delivery settings</button><div id="dMsg" class="notice hidden"></div></div>`;
 const {data}=await sb.from('site_settings').select('*').eq('key','delivery').maybeSingle();if(data?.value){$('dFree').value=data.value.free_threshold??'';$('dDefault').value=data.value.default_charge??'';$('dNotes').value=data.value.notes??''}
 $('saveDelivery').onclick=async()=>{const value={free_threshold:Number($('dFree').value||0),default_charge:Number($('dDefault').value||0),notes:$('dNotes').value};const {error}=await sb.from('site_settings').upsert({key:'delivery',value,updated_at:new Date().toISOString()},{onConflict:'key'});const m=$('dMsg');m.textContent=error?error.message:'Delivery settings saved.';m.className='notice '+(error?'':'ok');}
}
async function settings(){
 $('content').innerHTML=`<h1>Website & Policies</h1><p class="muted">Store the text that will eventually be displayed by the customer website.</p><div class="card"><div class="field"><label>Refund & Returns</label><textarea id="sReturns"></textarea></div><div class="field"><label>Personalised Orders</label><textarea id="sPersonal"></textarea></div><div class="field"><label>Privacy / Contact</label><textarea id="sPrivacy"></textarea></div><div class="field"><label>About / Footer note</label><textarea id="sFooter"></textarea></div><button class="btn" id="saveSettings">Save website text</button><div id="sMsg" class="notice hidden"></div></div>`;
 const {data}=await sb.from('site_settings').select('*').in('key',['returns','personalised','privacy','footer']);(data||[]).forEach(x=>{const map={returns:'sReturns',personalised:'sPersonal',privacy:'sPrivacy',footer:'sFooter'};if($(map[x.key]))$(map[x.key]).value=x.value?.text||''});
 $('saveSettings').onclick=async()=>{const vals={returns:$('sReturns').value,personalised:$('sPersonal').value,privacy:$('sPrivacy').value,footer:$('sFooter').value};let err=null;for(const [key,text] of Object.entries(vals)){const r=await sb.from('site_settings').upsert({key,value:{text},updated_at:new Date().toISOString()},{onConflict:'key'});if(r.error){err=r.error;break}}const m=$('sMsg');m.textContent=err?err.message:'Website text saved.';m.className='notice '+(err?'':'ok');}
}
const cfg=getConfig();if(cfg){$('sbUrl').value=cfg.url;$('sbKey').value=cfg.key;connect();}
</script>
</body>
</html>
